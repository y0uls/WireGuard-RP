name: ShellCheck

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Fins de ligne Unix (LF)
        run: |
          if grep -q "$(printf '\r')" wg-pi.sh; then
            echo "::error file=wg-pi.sh::Le fichier contient des fins de ligne Windows (CRLF) : il ne s'exécutera pas sur le Pi."
            exit 1
          fi

      - name: Syntaxe bash
        run: bash -n wg-pi.sh

      - name: ShellCheck
        run: shellcheck -S warning wg-pi.sh
